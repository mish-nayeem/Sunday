# Deploys supabase/functions to the SUNDAY Supabase project whenever they
# change on main. Supabase's GitHub integration only applies migrations, so
# edge functions go out from here.
#
# One-time setup: Supabase → Account → Access Tokens → generate a token, then
# GitHub → Settings → Secrets and variables → Actions → New repository secret
# named SUPABASE_ACCESS_TOKEN. Without it this workflow does nothing.
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qgvadxivqtlgobfzbdxt
    steps:
      - name: Check the access token is set
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set — add it under Settings → Secrets → Actions. Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      # The CLI from npm, pinned to 2.x: supabase/setup-cli asks GitHub's API
      # for the "latest" release, which failed on its rate limit.
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22

      # Every folder under supabase/functions except _shared (code they import).
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: npx --yes supabase@2 functions deploy --project-ref "$PROJECT_REF"
