# The live database's structure, written into this repo — by hand:
# Actions → Schema snapshot → Run workflow.
#
# The tables, columns, policies, functions and triggers as they are on the
# live project right now go into db/live_schema.sql on the branch
# schema-snapshot, for review and for comparing with supabase/migrations
# (some columns were added in the dashboard and are in no migration). It is
# a reference copy only — it's outside supabase/, so the Supabase GitHub
# integration never runs it.
#
# Needs the repository secret SUPABASE_DB_URL: Supabase → Connect → Session
# pooler → URI, with the database password in place of [YOUR-PASSWORD].

name: Schema snapshot

on:
  workflow_dispatch:

concurrency:
  group: supabase-db
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  # The database's Session pooler address (IPv4 — GitHub's machines have no
  # IPv6): Supabase → Connect → Session pooler → URI, password filled in.
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  PROJECT_REF: qgvadxivqtlgobfzbdxt

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump the live structure
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add a SUPABASE_DB_URL secret: Supabase → Connect → Session pooler → URI, with the database password in place of [YOUR-PASSWORD]."
            exit 1
          fi
          mkdir -p db
          supabase db dump --db-url "$SUPABASE_DB_URL" -f db/live_schema.sql
          wc -l db/live_schema.sql
      - name: Push it to the schema-snapshot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B schema-snapshot
          git add db/live_schema.sql
          git commit -m "Live database structure, from the Schema snapshot workflow" || echo "No change."
          git push -f origin schema-snapshot
