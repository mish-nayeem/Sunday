# Deploys the website (the Worker and its static assets) to Cloudflare on
# every push to main. Cloudflare's own Workers Builds got stuck account-wide
# (every build "Queued", then "Skipped"), so the site goes out from here, the
# same way as PAUSE.
#
# One-time setup — GitHub → Settings → Secrets and variables → Actions:
#   secrets  CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens,
#                                    "Edit Cloudflare Workers" template)
#            CLOUDFLARE_ACCOUNT_ID
#            VITE_SUPABASE_ANON_KEY (Supabase → Settings → API → anon public;
#                                    it ends up in the browser anyway)
#   optional variables (Variables tab): VITE_SUPABASE_IMAGE_TRANSFORM,
#            VITE_SITE_URL — the same as in Cloudflare's Build variables;
#            VITE_SENTRY_DSN — error reports to Sentry (off when empty);
#            VITE_IMAGE_CDN_HOST — the domain whose photos Cloudflare resizes
#            (src/lib/imageCdn.js; off when empty).
# Without the token and the anon key this workflow says so and stops.
#
# Order of things (audit HIGH-2 / MEDIUM-1):
#   1. The checks in ci.yml run first. If any fails, nothing is deployed and
#      the live site stays as it was.
#   2. A push that changes supabase/** isn't deployed from here at once: the
#      Supabase workflow (supabase.yml) updates the database and the edge
#      functions first, and when it has finished cleanly it starts this
#      workflow (workflow_run), so the site never goes live ahead of the
#      database it needs. If the Supabase run fails, nothing is deployed;
#      fix it and re-run it, and this follows once it's green.
name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Supabase]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and none cancels another: a run that will do nothing
# (the Supabase workflow finished red, or was started by hand) gets a group of
# its own, so it can't push out a real deploy; and a real deploy that's
# already running is left to finish (the next one follows it).
concurrency:
  group: ${{ (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion != 'success' || github.event.workflow_run.event != 'push')) && format('deploy-noop-{0}', github.run_id) || 'deploy' }}
  cancel-in-progress: false

jobs:
  # What to deploy, and whether now: a push that touches the database waits
  # for the Supabase workflow, which starts this again when it's done.
  plan:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          event="${{ github.event_name }}"
          if [ "$event" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            if [ "${{ github.event.workflow_run.conclusion }}" = "success" ] && [ "${{ github.event.workflow_run.event }}" = "push" ]; then go=true; else go=false; fi
            echo "After the Supabase workflow ($sha): go=$go"
          elif [ "$event" = "push" ]; then
            sha="${{ github.sha }}"
            before="${{ github.event.before }}"
            go=true
            if [ "$before" != "0000000000000000000000000000000000000000" ] && git diff --name-only "$before" "$sha" | grep -q '^supabase/'; then
              go=false
              echo "This push changes the database or the functions: the Supabase workflow runs first and starts the deploy when it's done."
            fi
          else
            sha="${{ github.sha }}"; go=true
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # The checks in ci.yml (lint, unit and browser tests). If any fails,
  # nothing is deployed and the live site stays as it was.
  checks:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  deploy:
    needs: [plan, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Add these under Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public: they're in the site's JavaScript for every visitor.
          VITE_SUPABASE_URL: https://qgvadxivqtlgobfzbdxt.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_IMAGE_TRANSFORM: ${{ vars.VITE_SUPABASE_IMAGE_TRANSFORM }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_IMAGE_CDN_HOST: ${{ vars.VITE_IMAGE_CDN_HOST }}

      - name: wrangler deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
