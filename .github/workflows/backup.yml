# A copy of the database every night, kept for 30 days — the free Supabase
# plan keeps none of its own.
#
# Every night at 03:17 Dhaka time (and by hand: Actions → Backup → Run
# workflow) this dumps the live database — its structure, and the data in
# public (orders, products, customers…), auth (accounts) and storage (the
# list of uploaded files; the photos themselves stay in Supabase Storage) —
# then locks it with a passphrase and keeps it as this run's artifact.
#
# It holds customers' names, phones and addresses, so it is never stored
# unlocked: without the BACKUP_PASSPHRASE secret the run stops before
# anything is saved.
#
# Needs repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — already there (deploy-functions.yml)
#   SUPABASE_DB_PASSWORD  — Supabase → Project Settings → Database → password
#   BACKUP_PASSPHRASE — a long passphrase of your own. Keep a copy somewhere
#                       safe outside GitHub: a backup can't be opened without it.
#
# To open one: download the artifact (Actions → Backup → a run → Artifacts),
# unzip it, then
#   gpg --decrypt sunday-db-<date>.tar.gz.gpg > sunday-db.tar.gz && tar xzf sunday-db.tar.gz
# which gives schema.sql and data.sql.

name: Backup

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

concurrency:
  group: supabase-db
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
  PROJECT_REF: qgvadxivqtlgobfzbdxt

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Passphrase set?
        run: |
          if [ ${#BACKUP_PASSPHRASE} -lt 12 ]; then
            echo "::error::Add a BACKUP_PASSPHRASE secret (12+ characters) first — a backup is never kept unlocked."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump the database
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          mkdir -p backup
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f backup/schema.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy \
            --schema public,auth,storage -f backup/data.sql
          ls -la backup

      - name: Lock it
        id: lock
        run: |
          name="sunday-db-$(date -u +%Y-%m-%d)"
          tar czf "$name.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la "$name.tar.gz.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.lock.outputs.name }}
          path: ${{ steps.lock.outputs.name }}.tar.gz.gpg
          retention-days: 30
          if-no-files-found: error
